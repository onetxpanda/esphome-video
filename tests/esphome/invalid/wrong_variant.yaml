esphome:
  name: invalid-test
esp32:
  variant: esp32s3
  framework:
    type: esp-idf
external_components:
  - source:
      type: local
      path: ../../../components
    components: [video_core, video_controls, mlx90640, radiometric, isp, overlay, video_camera, video_test_pattern, h264_encoder, rtsp_server]
logger:
i2c:
  sda: GPIO7
  scl: GPIO8
mlx90640:
  id: thermal_sensor
radiometric:
  id: thermal_rad
  source: thermal_sensor
isp:
  id: thermal_cam
  source: thermal_rad
  scale: 4
wifi:
  ssid: x
  password: xxxxxxxx
h264_encoder:
  source: thermal_cam
