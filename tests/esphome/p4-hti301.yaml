# Compile test: an HTI-301 USB thermal camera beside an MLX90640 on an
# ESP32-P4, each with its own processing chain (several radiometric, isp and
# overlay instances).
#   hti301 (radiometric) -> radiometric -> isp -> overlay -> h264_encoder -> rtsp_server
#   hti301 (processed)  ----------------------------------/
#   mlx90640 ------------> radiometric -> isp -> overlay -/
# A video_switch chooses what both the encoder and the camera entity get; its
# "HTI-301" entry holds both of the camera's outputs, and the HTI-301's mode
# select decides which of them produces frames.
# Each camera's chain is its own sub-device, so their entities share names.
esphome:
  name: p4-hti301
  devices:
    - id: hti_device
      name: "HTI-301"
    - id: mlx_device
      name: "MLX90640"

esp32:
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: hex

external_components:
  - source:
      type: local
      path: ../../components
    components: [assert_capture, task_stats, video_core, video_controls, hti301, mlx90640, radiometric, isp, overlay, video_camera, video_switch, video_palette, h264_encoder, rtsp_server]

logger:
api:
ota:
  - platform: esphome

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  power_pin: GPIO51

i2c:
  - id: bus_i2c
    sda: GPIO7
    scl: GPIO8
    frequency: 1MHz

mlx90640:
  id: mlx
  i2c_id: bus_i2c
  device_id: mlx_device
  controls:
    refresh_rate:
      name: "Refresh Rate"

assert_capture:
  last_crash:
    name: "Last Crash"

task_stats:
  load:
    name: "CPU Load"

usb_host:
  enable_hubs: true

hti301:
  id: hti
  device_id: hti_device
  mode: radiometric
  range: normal
  palette: ironbow
  emissivity: 0.96
  ambient_temperature: 24
  humidity: 40%
  distance: 1.2
  log_timing: true
  controls:
    mode:
      name: "Mode"
    range:
      name: "Range"
    palette:
      name: "Palette"
    emissivity:
      name: "Emissivity"
    calibrate:
      name: "Calibrate"
    restart_usb:
      name: "USB Restart"
  streaming:
    name: "Streaming"
  usb_status:
    name: "USB"

radiometric:
  - id: hti_rad
    source: hti
    device_id: hti_device
    log_timing: true
    min:
      name: "Min"
    max:
      name: "Max"
    center:
      name: "Center"
  - id: mlx_rad
    source: mlx
    device_id: mlx_device
    max:
      name: "Max"

isp:
  - id: hti_isp
    source: hti_rad
    device_id: hti_device
    scale: 1
    controls:
      range_min:
        name: "Range Min"
  - id: mlx_isp
    source: mlx_rad
    device_id: mlx_device
    scale: 20
    scaler: ppa
    controls:
      range_min:
        name: "Range Min"

overlay:
  - id: hti_overlay
    source: hti_isp
    device_id: hti_device
    unit: C
    controls:
      unit:
        name: "Overlay Unit"
  - id: mlx_overlay
    source: mlx_isp
    device_id: mlx_device
    controls:
      unit:
        name: "Overlay Unit"

video_palette:
  name: "Palette"
  palette: lava
  targets: [mlx_isp, hti_isp, hti]

video_switch:
  id: stream_switch
  sources:
    - name: "MLX90640"
      source: mlx_overlay
    - name: "HTI-301"
      source: [hti_overlay, hti]
  select:
    name: "Stream Source"

video_camera:
  name: "Camera"
  source: stream_switch

h264_encoder:
  id: hti_h264
  source: stream_switch

rtsp_server:
  encoder: hti_h264
  path: thermal
