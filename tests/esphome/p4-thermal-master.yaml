radiometric:
  - id: p1_rad
    source: p1
    outlier_level: 0
    min:
      name: "P1 Min Temperature"
    max:
      name: "P1 Max Temperature"

isp:
  - id: p1_isp
    source: p1_rad
    scale: 4
    range_min: 15
    range_max: 40

overlay:
  - id: p1_overlay
    source: p1_isp
    unit: F

# The camera's own picture.
video_camera:
  name: "P1 Picture"
  source: p1

h264_encoder:
  id: p1_h264
  source: p1_overlay

rtsp_server:
  encoder: p1_h264
