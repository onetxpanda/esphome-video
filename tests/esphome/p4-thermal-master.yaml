# Compile test: a Thermal Master P1 USB thermal camera on an ESP32-P4, with
# every setting, reading and maintenance command it has as an entity.
#   thermal_master_p1 -> radiometric -> isp -> overlay -> h264_encoder -> rtsp_server
#   thermal_master_p1 (the camera's own picture) -> video_camera
esphome:
  name: p4-thermal-master

esp32:
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: hex

external_components:
  - source:
      type: local
      path: ../../components
    components: [video_core, video_controls, thermal_master_p1, radiometric, isp, overlay, video_camera, h264_encoder, rtsp_server]

logger:
api:
ota:
  - platform: esphome

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  power_pin: GPIO51

usb_host:
  enable_hubs: true

thermal_master_p1:
  id: p1
  log_timing: true
  update_interval: 30s
  heartbeat_interval: 2s
  camera_point:
    x: 80
    y: 60
  settings:
    range: auto
    mirror_flip: none
    emissivity: 0.95
    ambient: 25
    isothermal_limit:
      low: -20
      high: 120
    sun_detect_pixel_ratio:
      min: 5
      max: 50
  controls:
    gain:
      name: "P1 Gain"
    offset:
      name: "P1 Offset"
