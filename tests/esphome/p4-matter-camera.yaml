# Compile test: a Matter camera streaming the test pattern over WebRTC, next
# to the RTSP server on the same encoder. Wi-Fi through an ESP32-C6
# co-processor (ESP-Hosted), as on ESP32-P4 dev kits.
esphome:
  name: p4-matter-camera

esp32:
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: hex

external_components:
  - source:
      type: local
      path: ../../components
    components: [video_core, video_controls, video_test_pattern, h264_encoder, rtsp_server, matter, matter_camera]

logger:
api:
ota:
  - platform: esphome

network:
  enable_ipv6: true

esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: test
  password: test-password

video_test_pattern:
  id: pattern
  width: 320
  height: 240
  fps: 15

h264_encoder:
  id: pattern_h264
  source: pattern
  fps: 15

rtsp_server:
  encoder: pattern_h264
  path: test

matter:

matter_camera:
  encoder: pattern_h264

text_sensor:
  - platform: matter
    manual_pairing_code:
      name: "Matter Pairing Code"
